<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临床监测工具集</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --hover: #f3f4f6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 72px; }

  header { margin-bottom: 32px; }
  header h1 { font-size: 1.7rem; font-weight: 700; margin-bottom: 6px; }
  header p { color: var(--muted); font-size: 0.95rem; }

  .modules { display: flex; flex-direction: column; gap: 8px; }

  .module {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  /* 一级大标题：无子项的用整块链接，有子项的用按钮 */
  .module-title, .module-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 16px 20px;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }
  .module-title:hover, .module-header:hover { background: var(--hover); }

  .chevron {
    color: var(--muted);
    font-size: 0.8rem;
    transition: transform 0.2s;
  }
  .module.open .chevron { transform: rotate(180deg); }

  /* 二级子标题（展开后显示） */
  .module-subitems {
    display: none;
    border-top: 1px solid var(--border);
    background: #fafbfc;
  }
  .module.open .module-subitems { display: block; }
  .module-subitems a {
    display: block;
    padding: 12px 20px 12px 44px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.92rem;
  }
  .module-subitems a:hover { background: var(--hover); color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">

    <header>
      <h1>临床监测工具集</h1>
    </header>

    <div class="modules">

      <div class="module">
        <a class="module-title" href="baseline/">一、基线特征监测</a>
      </div>

      <div class="module" id="m-safety">
        <button class="module-header" onclick="toggleModule('m-safety')">
          <span>二、安全性监测</span>
          <span class="chevron">▾</span>
        </button>
        <div class="module-subitems">
          <a href="safety-lb/">实验室检查监测</a>
          <a href="safety-ae/">AE监测</a>
        </div>
      </div>

      <div class="module">
        <a class="module-title" href="event-count/">三、事件数监测</a>
      </div>

      <div class="module" id="m-anomaly">
        <button class="module-header" onclick="toggleModule('m-anomaly')">
          <span>四、数据异常监测</span>
          <span class="chevron">▾</span>
        </button>
        <div class="module-subitems">
          <a href="multivariate/">多元离群与内值</a>
          <a href="data-anomaly/">访视间变异与受试者变异</a>
        </div>
      </div>

      <div class="module">
        <a class="module-title" href="kri/">五、风险指标监测</a>
      </div>

      <div class="module">
        <a class="module-title" href="受试者简介工具/TQC2731-III-01_受试者简介.html">六、试验参与者简介</a>
      </div>

    </div>
  </div>

  <script>
    function toggleModule(id) {
      document.getElementById(id).classList.toggle('open');
    }
  </script>
</body>
</html>
